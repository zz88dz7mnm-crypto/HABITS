<!doctype html>
<html lang="es" data-theme="dark" data-accent="rojo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenit — Central de Comando Personal</title>
<meta name="description" content="Hábitos con grilla y gráficos, finanzas, entrenamiento, diario y modo pausa. Web app instalable que funciona offline.">
<meta name="theme-color" content="#0A0A0D">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zenit">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&family=JetBrains+Mono:wght@400;600&display=swap">

<link rel="stylesheet" href="src/css/tokens.css">
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/app.css">

<style>
  /* Pantalla de arranque: se muestra hasta que la app pinta la primera vista.
     Evita el destello de fondo blanco antes de que carguen los estilos. */
  #boot {
    position: fixed; inset: 0; z-index: 500;
    display: grid; place-items: center; gap: 18px;
    background: var(--bg);
    transition: opacity .4s var(--e-out), visibility .4s;
  }
  #boot.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot svg { width: 44px; height: 44px; animation: bootPulse 1.6s var(--e-inout) infinite; }
  @keyframes bootPulse {
    0%,100% { opacity: .5; transform: scale(.94); }
    50%     { opacity: 1;  transform: scale(1); }
  }
  #boot noscript {
    max-width: 34ch; text-align: center; color: var(--text-2);
    font-size: .9rem; line-height: 1.6;
  }
</style>
</head>
<body>

<div id="boot">
  <svg viewBox="0 0 512 512" aria-label="Cargando Zenit">
    <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3B3B"/><stop offset="1" stop-color="#FF9D4B"/>
    </linearGradient></defs>
    <path d="M318 96 L196 96 L128 232 L214 232 L152 416 L360 214 L262 214 Z" fill="url(#bg1)"/>
  </svg>
  <noscript>Zenit necesita JavaScript para funcionar: toda la app corre en tu dispositivo, sin servidor.</noscript>
</div>

<div id="app"></div>

<!-- Sin bundler ni dependencias: los scripts se cargan en orden y se cuelgan
     de un único objeto global (SL). Así el proyecto funciona igual servido
     por HTTP que abierto directo desde el disco. -->
<script src="src/js/ui.js"></script>
<script src="src/js/store.js"></script>
<script src="src/js/compute.js"></script>
<script src="src/js/charts.js"></script>
<script src="src/js/notify.js"></script>
<script src="src/js/views/inicio.js"></script>
<script src="src/js/views/habitos.js"></script>
<script src="src/js/views/finanzas.js"></script>
<script src="src/js/views/entrenamiento.js"></script>
<script src="src/js/views/diario.js"></script>
<script src="src/js/views/progreso.js"></script>
<script src="src/js/views/pausa.js"></script>
<script src="src/js/views/otras.js"></script>
<script src="src/js/views/config.js"></script>
<script src="src/js/app.js"></script>
<script>
  // La app ya pintó: se retira el arranque.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      var b = document.getElementById('boot');
      if (b) b.classList.add('is-done');
    });
  });
</script>

</body>
</html>
